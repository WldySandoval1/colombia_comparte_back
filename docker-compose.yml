services:
  # ──────────────────────────────────────────────────
  # Servicio 1: MongoDB
  # ──────────────────────────────────────────────────
  mongo:
    image: mongo:6
    container_name: unidev-mongo
    ports:
      - "27017:27017"
    volumes:
      - datos-mongo:/data/db
    networks:
      - unidev-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────
  # Servicio 2: API Backend (Node.js + TypeScript)
  # ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unidev-api
    ports:
      - "3000:3000"
    environment:
      - DB_CONNECTION=mongodb://mongo:27017/unidev
      - DB_CONNECTION_TEST=mongodb://mongo:27017/unidev_test
      - PORT=3000
      - JWT_KEY=mi-clave-jwt-super-secreta-cambiar-en-produccion
    volumes:
      - ./src:/app/src
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - unidev-net
    restart: on-failure

# ──────────────────────────────────────────────────
# Volúmenes y Redes
# ──────────────────────────────────────────────────
volumes:
  datos-mongo:

networks:
  unidev-net:
    driver: bridge
